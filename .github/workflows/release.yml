name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version (e.g. v1.0.1)'
        required: false
        default: 'v1.0.1'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  ACTIONS_FORCE_NODE24: 'true'

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Extract Version Info
        id: get_version
        shell: pwsh
        run: |
          $rawTag = $env:GITHUB_REF_NAME
          if (-not $rawTag -or $rawTag -eq "main") {
            $rawTag = "${{ github.event.inputs.version }}"
            if (-not $rawTag) {
              $rawTag = "v1.0.1"
            }
          }
          $cleanVer = $rawTag.TrimStart('v')
          Write-Output "RELEASE_TAG=$rawTag" >> $env:GITHUB_ENV
          Write-Output "APP_VERSION=$cleanVer" >> $env:GITHUB_ENV
          Write-Host "Resolved Release Tag: $rawTag"
          Write-Host "Resolved App Version: $cleanVer"

      - name: Build and Publish PDFDual
        shell: pwsh
        run: |
          dotnet publish src/PDFDual/PDFDual.csproj `
            -c Release `
            -r win-x64 `
            --self-contained false `
            -p:PublishReadyToRun=true `
            -p:Version="${{ env.APP_VERSION }}" `
            -o publish/PDFDual

          Compress-Archive -Path publish/PDFDual/* -DestinationPath "publish/PDFDual-${{ env.RELEASE_TAG }}-win-x64.zip" -Force

      - name: Build and Publish IconCraft
        shell: pwsh
        run: |
          dotnet publish src/IconCraft/IconCraft.csproj `
            -c Release `
            -r win-x64 `
            --self-contained false `
            -p:PublishReadyToRun=true `
            -p:Version="${{ env.APP_VERSION }}" `
            -o publish/IconCraft

          Compress-Archive -Path publish/IconCraft/* -DestinationPath "publish/IconCraft-${{ env.RELEASE_TAG }}-win-x64.zip" -Force

      - name: Generate Automated UI Screenshots
        shell: pwsh
        run: |
          ./scripts/capture_screenshots.ps1

      - name: Commit and Push Updated Screenshots (if changed)
        shell: pwsh
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.jpg
          $hasChanges = git status --porcelain
          if ($hasChanges) {
            git commit -m "chore(assets): auto-update UI preview screenshots for ${{ env.RELEASE_TAG }} [skip ci]"
            git push origin main
          } else {
            Write-Host "Screenshots up to date, no changes to commit."
          }

      - name: Package Full FluentToolbox
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "publish/FluentToolbox/PDFDual" -Force
          New-Item -ItemType Directory -Path "publish/FluentToolbox/IconCraft" -Force
          Copy-Item publish/PDFDual/* "publish/FluentToolbox/PDFDual" -Recurse -Force
          Copy-Item publish/IconCraft/* "publish/FluentToolbox/IconCraft" -Recurse -Force
          Copy-Item README.md "publish/FluentToolbox/" -Force
          Copy-Item LICENSE "publish/FluentToolbox/" -Force
          Compress-Archive -Path publish/FluentToolbox/* -DestinationPath "publish/FluentToolbox-${{ env.RELEASE_TAG }}-win-x64.zip" -Force

      - name: Create or Update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ env.RELEASE_TAG }}" `
            publish/FluentToolbox-${{ env.RELEASE_TAG }}-win-x64.zip `
            publish/PDFDual-${{ env.RELEASE_TAG }}-win-x64.zip `
            publish/IconCraft-${{ env.RELEASE_TAG }}-win-x64.zip `
            --clobber
          if ($LASTEXITCODE -ne 0) {
            gh release create "${{ env.RELEASE_TAG }}" `
              --title "FluentToolbox ${{ env.RELEASE_TAG }}" `
              publish/FluentToolbox-${{ env.RELEASE_TAG }}-win-x64.zip `
              publish/PDFDual-${{ env.RELEASE_TAG }}-win-x64.zip `
              publish/IconCraft-${{ env.RELEASE_TAG }}-win-x64.zip
          }
